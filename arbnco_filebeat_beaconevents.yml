filebeat.config.modules:
  path: ${path.config}/modules.d/*.yml
  reload.enabled: false

setup.template.settings:
  index.number_of_shards: 1
  #index.codec: best_compression
  #_source.enabled: false

# Processing of the message
processors:
  - decode_json_fields:
      fields: ["message"]
      target: json
      process_array: false
      max_depth: 6
      overwrite_keys: true
      when:
        regexp:
          jsonmessage: '^\{'

# Filebeat input from beacon_events api call from spaceti
filebeat.inputs:


  - type: httpjson
    url: http://localhost:3000/arbnco?per_page=500&pageNumber=1&SITEID=${SITEID}&mode=history
    http_headers:
      Authorization: "eyJhbGciOiJIUzI1NiJ9.eyJ1c2VyX2lkIjoxMzAsImV4cCI6MTkyMDYyODk4OSwicmFuZGsiOiI0OTIwNzgwMDQ2NSJ9.JkyWwXO8Rn0J4zWhrZyulqkux0F9YBSSMJDhSQ2OtGw"
    http_method: GET
    #interval: 20s
    tags: ["beacon_events"]
    pagination:
      header:
        field_name: Link
        regex_pattern: '([^"]*)'

# output config to logstash at port 5024
