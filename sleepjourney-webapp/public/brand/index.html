/*TOGGLE BUTTON*/
.switch {
  position: relative;
  display: inline-block;
  width: 40px;
  height: 24px;
  display: none;
}

.switch input {
  opacity: 0;
  width: 0;
  height: 0;
}

.slider {
  position: absolute;
  cursor: pointer;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background-color: #ffffff;
  /*
  -webkit-transition: .4s;
  transition: .4s;
  /*
  border: 0.5px;
  border-style: solid;
  border-color: rgb(133,133,133);
  */
}

.slider:before {
  position: absolute;
  content: "";
  height: 16px;
  width: 16px;
  left: 4px;
  bottom: 4px;
  background-color: rgb(230,0,0);

  -webkit-transition: .1s;
  transition: .1s;

}
.slider.inactive:before {
  background-color: rgb(210,210,210);
}


input:checked + .slider:before {
  background-color: white !important;
}

input:checked + .slider {
  background-color: rgb(230,0,0);
}

input:focus + .slider {
  box-shadow: 0 0 1px #2196F3;
}


input:checked + .slider.inactive {
    background-color: rgb(210,210,210) !important;
}


input:checked + .slider:before {
  -webkit-transform: translateX(16px);
  -ms-transform: translateX(16px);
  transform: translateX(16px);
}

/* Rounded sliders */
.slider.round {
  border-radius: 34px;
}

.slider.round:before {
  border-radius: 50%;
}

#canvas{
    display: block;
       padding: 0;
      margin: 0;
      height: 100%;
}

input[type=range] {
  -webkit-appearance: none;
  margin: 10px 0;
  width: 100%;
}
input[type=range]:focus {
  outline: none;
}
input[type=range]::-webkit-slider-runnable-track {
  width: 100%;
  height: 4px;
  cursor: pointer;
  animate: 0.2s;
  box-shadow: 0px 0px 0px #000000;
  border-radius: 0px;
  border: 0px solid #000000;
}
input[type=range]::-webkit-slider-thumb {
  box-shadow:  0px 0px 0px rgb(195 195 195);
  /*box-shadow:  1px 1px 3px rgb(195 195 195);*/
  border: 0px solid #000000;
  height: 15px;
  width: 15px;
  border-radius: 25px;
  background: #FFFFFF00;
  cursor: pointer;
  -webkit-appearance: none;
  margin-top: -5.5px;
}

input[type=range]::-moz-range-track {
  width: 100%;
  height: 4px;
  cursor: pointer;
  animate: 0.2s;
  box-shadow: 0px 0px 0px #000000;
  border-radius: 0px;
  border: 0px solid #000000;
}
input[type=range]::-moz-range-thumb {
  box-shadow: 1px 1px 3px rgb(195 195 195);
  border: 0px solid #000000;
  height: 15px;
  width: 15px;
  border-radius: 25px;
  background: #FFFFFF00;
  cursor: pointer;
}
input[type=range]::-ms-track {
  width: 100%;
  height: 4px;
  cursor: pointer;
  animate: 0.2s;
  background: transparent;
  border-color: transparent;
  color: transparent;
}

input[type=range]::-ms-thumb {
  box-shadow: 1px 1px 3px rgb(195 195 195) !important;
  border: 0px solid #000000;
  height: 15px;
  width: 15px;
  border-radius: 250px;
  background: #FFFFFF00;
  cursor: pointer;
}

.select {

.select_arrow {
    position: absolute;
    top: 7px;
    right: 15px;
    width: 0px;
    height: 0px;
    border: solid #7b7b7b;
    border-width: 0 3px 3px 0;
    display: inline-block;
    padding: 3px;
    transform: rotate(45deg);
    -webkit-transform: rotate(45deg);
}

.dropdown-content {
  display: none;
  position: absolute;
  background-color: #f1f1f1;
  min-width: 160px;
  overflow: auto;
  box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
  right: 0;
  z-index: 1;
}


.select select:hover ~ .select_arrow,
.select select:focus ~ .select_arrow {
    border-color: #000000;
}
.select select:disabled ~ .select_arrow {
    border-top-color: #cccccc;
}

#custom_tooltip {
  position: relative;
  cursor: pointer;
}
#custom_tooltip:before,
#custom_tooltip:after {
   font-family:"vodafone_font";
  line-height: 1;
  font-size: .9em;
  pointer-events: none;
  position: absolute;
  box-sizing: border-box;
  display: none;
  opacity: 0;

}
#custom_tooltip:before {
  content: "";
  border: 5px solid transparent;
  z-index: 100;
}
#custom_tooltip:after {
  content: "testme" ;/*attr(data-tooltip);*/
  text-align: center;
  min-width: 3em;
  max-width: 21em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  padding: 6px 8px;
  border-radius: 3px;
  background: #FFFFFF;
  color: #A6A6A6;
  z-index: 99;
  filter: drop-shadow(0px 0px 1px #A6A6A6);
}
#custom_tooltip:hover:before,
#custom_tooltip:hover:after {
  display: block;
  opacity: 1;
}
#custom_tooltip:not([data-flow])::before,
#custom_tooltip[data-flow="top"]::before {
  bottom: 100%;
  border-bottom-width: 0;
  border-top-color: #FFFFFF;
  filter: drop-shadow(0px 1px 0px #A6A6A6);
}
#custom_tooltip:not([data-flow])::after,
#custom_tooltip[data-flow="top"]::after {
  bottom: calc(100% + 5px);
}
#custom_tooltip:not([data-flow])::before, [tooltip]:not([data-flow])::after,
#custom_tooltip[data-flow="top"]::before,
#custom_tooltip[data-flow="top"]::after {
  left: 50%;
  -webkit-transform: translate(-50%, -4px);
          transform: translate(-50%, -4px);
}
