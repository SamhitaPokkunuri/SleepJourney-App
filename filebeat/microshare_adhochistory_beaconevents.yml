# tempate number of shards
setup.template.settings:
  index.number_of_shards: 1

# Processing of the message
processors:
  - decode_json_fields:
      fields: ["message"]
      target: json
  - convert:
      fields:
        - {from: "_id", to: "doc_id", type: "string"}
        - {from: "json.data.current", type: "string"}
      ignore_missing: true
      fail_on_error: false

# Filebeat input from deployments, api call from microshare
filebeat.inputs:
  ########################## Adhoc History Filebeats ###########################
  - type: httpjson
    url: http://localhost:3000/microshare/adhochistory?pageSize=500&pageNumber=1&type=current&firsttime=true
    http_method: GET
    interval: 120s
    timeout: 300s
    json_objects_array: objs
    tags: ["current"]
    pagination:
      header:
        field_name: Link
        regex_pattern: '([^"]*)'

  - type: httpjson
    url: http://localhost:3000/microshare/adhochistory?pageSize=500&pageNumber=1&type=leak&firsttime=true
    http_method: GET
    interval: 130s
    timeout: 300s
    json_objects_array: objs
    tags: ["leak"]
    pagination:
      header:
        field_name: Link
        regex_pattern: '([^"]*)'

  - type: httpjson
    url: http://localhost:3000/microshare/adhochistory?pageSize=500&pageNumber=1&type=openclose&firsttime=true
    http_method: GET
    interval: 140s
    timeout: 300s
    json_objects_array: objs
    tags: ["openclose"]
    pagination:
      header:
        field_name: Link
        regex_pattern: '([^"]*)'

  - type: httpjson
    url: http://localhost:3000/microshare/adhochistory?pageSize=500&pageNumber=1&type=occupancy&firsttime=true
    http_method: GET
    interval: 150s
    timeout: 300s
    json_objects_array: objs
    tags: ["occupancy"]
    pagination:
      header:
        field_name: Link
        regex_pattern: '([^"]*)'

  - type: httpjson
    url: http://localhost:3000/microshare/adhochistory?pageSize=500&pageNumber=1&type=environment&firsttime=true
    http_method: GET
    interval: 160s
    timeout: 300s
    json_objects_array: objs
    tags: ["environment"]
    pagination:
      header:
        field_name: Link
        regex_pattern: '([^"]*)'

# output config to logstash at port 5029
# change the hosts array to the correct logstash server name
output.logstash:
  hosts: ["localhost:5029"]
  timeout: 300s
  bulk_max_size: 204800
